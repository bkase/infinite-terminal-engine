name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  commit-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install repo hooks
        run: scripts/install-hooks.sh
      - name: Verify commit gate
        run: scripts/verify-commit.sh
  demo-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install repo hooks
        run: scripts/install-hooks.sh
      - name: Verify demo gate
        run: scripts/verify-demo.sh
