name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fast-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install repo hooks
        run: scripts/install-hooks.sh
      - name: Verify fast gate
        run: scripts/verify-fast.sh
  slow-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install repo hooks
        run: scripts/install-hooks.sh
      - name: Verify slow gate
        run: scripts/verify-slow.sh
